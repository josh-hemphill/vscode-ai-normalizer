name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-proxy:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win32
            arch: x64
            ext: .exe
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: darwin
            arch: x64
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin
            arch: arm64
            ext: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x64
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: proxy-${{ matrix.target }}
      - run: cargo build --release -p normalizer-proxy --target ${{ matrix.target }}
      - name: Stage binary (keep platform-arch path in artifact)
        shell: bash
        run: |
          ROOT="artifact-root/${{ matrix.platform }}-${{ matrix.arch }}"
          mkdir -p "$ROOT"
          SRC="target/${{ matrix.target }}/release/normalizer-proxy${{ matrix.ext }}"
          cp "$SRC" "$ROOT/normalizer-proxy${{ matrix.ext }}"
          chmod +x "$ROOT/normalizer-proxy${{ matrix.ext }}"
      - uses: actions/upload-artifact@v7
        with:
          name: proxy-${{ matrix.platform }}-${{ matrix.arch }}
          path: artifact-root

  package-vsix:
    needs: build-proxy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - name: Download all proxy binaries
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: proxy-*
          merge-multiple: true
      - name: Layout bin/
        run: node scripts/layout-release-binaries.mjs artifacts
      - name: Ensure linux proxy is executable
        run: |
          test -f bin/linux-x64/normalizer-proxy
          chmod +x bin/linux-x64/normalizer-proxy
      - run: pnpm install
      - run: pnpm run compile
      - run: pnpm run lint
      - run: pnpm run test:ts
      - run: node scripts/integration-proxy.mjs
      - name: Verify package version matches tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
      - name: Extract changelog for release
        id: changelog
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BODY=$(node scripts/extract-changelog-section.mjs "$VERSION")
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - run: npm install -g @vscode/vsce
      - run: vsce ls
      - run: vsce package --pre-release --out ai-endpoint-normalizer.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: ai-endpoint-normalizer.vsix
      - name: GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ai-endpoint-normalizer.vsix
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: false
          prerelease: true
